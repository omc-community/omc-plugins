name: Validate & Generate Registry

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  validate-and-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Auto-generate registry.json
        run: go run ./scripts/generate.go

      - name: Validate all registries and consistency
        run: go test -v ./...

      - name: Auto-commit generated registry.json (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain registry.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add registry.json
            git commit -m "chore(ci): auto-generate registry.json from official.json and community.json"
            git push
          else
            echo "registry.json is already up to date"
          fi
